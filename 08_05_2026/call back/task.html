<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Food ordering</title>
</head>
<body>
   <h1>online food ordering</h1>
   
   <div id="container">

    <div id="card">
        <h2>Pizza</h2>
        <p>150</p>
         <img src="https://static.vecteezy.com/system/resources/previews/022/994/042/non_2x/the-pepperoni-pizza-and-a-piece-of-streched-cheese-pizza-with-ai-generated-free-photo.jpg" alt="" style="height: 200px; width: 200px;">
        <button id="addPizza">Add to cart</button>
    </div>

    <div id="card">

        <h2>Burger</h2>
        <img src="https://tse1.mm.bing.net/th/id/OIP.YGzkrFYsCb0TbPzvhsnu_wHaHc?pid=ImgDet&w=175&h=176&c=7&dpr=1.1&o=7&rm=3" alt="" style="height: 200px; width: 200px;">
        <p>100</p>

        <button id="addBurger">Add to cart</button>
    </div>

    <div id="card">

        <h2>Fried Rice</h2>
        <img src="https://tse1.mm.bing.net/th/id/OIP.I7phQqNlHdgXzUwRMKM7lAHaHa?pid=ImgDet&w=175&h=175&c=7&dpr=1.1&o=7&rm=3" alt="" style="height: 200px; width: 200px;">
        <p>190</p>

        <button id="addFriedRice">Add to cart</button>
    </div>
   </div>


   <!-- cart items -->

   <div id="cart">

    <h2>cart items</h2>
    <ul id="cartitems">

    </ul>

    <button id="orderbtn">order now</button>

    <h2 id="message"></h2>
   </div>
   <script src="./task.js"></script>
</body>
</html>
