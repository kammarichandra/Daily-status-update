
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Variables Dashboard</title>
    <link rel="stylesheet" href="./AdvanceCss.css">
</head>
<body>

    <header class="navbar">
        <h2>TeamSync</h2>
        <button class="theme-btn">Change Theme</button>
    </header>

    <main class="container">

        <h1>Employee Dashboard</h1>
        <p class="subtitle">Welcome to your employee management system.</p>

        <section class="cards">

            <div class="card">
                <h3>Total Employees</h3>
                <h2>120</h2>
                <p>Active employees</p>
            </div>

            <div class="card">
                <h3>Projects</h3>
                <h2>25</h2>
                <p>Ongoing projects</p>
            </div>

            <div class="card">
                <h3>Departments</h3>
                <h2>8</h2>
                <p>Available departments</p>
            </div>

        </section>

        <section class="profile">
            <h2>Employee Profile</h2>
            <p><strong>Name:</strong> Chandra Sekhar</p>
            <p><strong>Role:</strong> Frontend Developer</p>
            <p><strong>Department:</strong> Development</p>
            <button class="primary-btn">View Profile</button>
        </section>

    </main>

</body>
</html>
