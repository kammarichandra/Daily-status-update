<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./Animations.css">
    <title>Document</title>
</head>

<body>
    <h1>CSS Animation Practice</h1>

    <div class="container">
        <div class="box">Animate Me</div>
    </div>

    <h1>Loading Animation</h1>

    <div class="loader"></div>

    <h1>Animate Buttons</h1>

    <button class="btn">Click Me</button>

    <h1>Animate cards</h1>

    <div class="card">
        <img src="https://placehold.co/300x150" alt="Profile">
        <h3>Employee Name</h3>
        <p>Frontend Developer</p>
    </div>

    <h1>Tool tip</h1>
    <div class="tooltip">
        Hover Me
        <span class="tooltip-text">Employee Details</span>
    </div>


</body>

</html>
