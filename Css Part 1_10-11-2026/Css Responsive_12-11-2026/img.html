
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Images</title>
    <link rel="stylesheet" href="./img.css">
</head>
<body>

    <header>
        <h1>Responsive Image Gallery</h1>
        <p>Images that adjust automatically to screen sizes</p>
    </header>

    <section class="gallery">

        <div class="card">
            <img src="https://picsum.photos/id/1015/600/400"
                 alt="Mountain Landscape">
            <h3>Mountain</h3>
        </div>

        <div class="card">
            <img src="https://picsum.photos/id/1011/600/400"
                 alt="Nature Landscape">
            <h3>Nature</h3>
        </div>

        <div class="card">
            <img src="https://picsum.photos/id/1016/600/400"
                 alt="River Landscape">
            <h3>River</h3>
        </div>

        <div class="card">
            <img src="https://picsum.photos/id/1020/600/400"
                 alt="Forest Landscape">
            <h3>Forest</h3>
        </div>

    </section>

</body>
</html>
