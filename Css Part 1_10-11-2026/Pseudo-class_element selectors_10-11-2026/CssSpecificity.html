
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee Information</title>
    <link rel="stylesheet" href="./CssSpecificity.css">
</head>
<body>

    <div class="employee-container">

        <h1>Employee Information</h1>

        <div class="employee-card">

            <h2 class="employee-name" id="name">
                Chandra Sekhar
            </h2>

            <p class="designation">
                Associate Software Engineer
            </p>

            <p class="department">
                Department: Software Development
            </p>

            <p class="email">
                Email: chandra@example.com
            </p>

            <p class="location">
                Location: Hyderabad
            </p>

            <button id="view-btn">View Details</button>

        </div>

        <div class="employee-card">

            <h2 class="employee-name">
                Rahul Kumar
            </h2>

            <p class="designation">
                Frontend Developer
            </p>

            <p class="department">
                Department: UI Development
            </p>

        </div>

    </div>

</body>
</html>
