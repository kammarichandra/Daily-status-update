<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./index.css">
    <title>Document</title>
</head>
<body>
     <h1>Employee Dashboard</h1>

    <section class="container">

        <div class="card">
            <img src="https://i.pravatar.cc/150?img=12" alt="Employee">
            <h2>Chandra Sekhar</h2>
            <p>Frontend Developer</p>
            <button>View Profile</button>
        </div>

        <div class="card">
            <img src="https://i.pravatar.cc/150?img=11" alt="Employee">
            <h2>Rahul</h2>
            <p>Backend Developer</p>
            <button>View Profile</button>
        </div>

        <div class="card">
            <img src="https://i.pravatar.cc/150?img=47" alt="Employee">
            <h2>Priya</h2>
            <p>UI/UX Designer</p>
            <button>View Profile</button>
        </div>

    </section>

    <section class="container1">

        <h2>Dashboard Overview</h2>

        <div class="cards">

            <div class="card">
                <h3>Total Employees</h3>
                <h1>120</h1>
                <p>Active employees</p>
            </div>

            <div class="card">
                <h3>Total Projects</h3>
                <h1>25</h1>
                <p>Ongoing projects</p>
            </div>

            <div class="card">
                <h3>Departments</h3>
                <h1>8</h1>
                <p>Available departments</p>
            </div>

        </div>

    </section>
