<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<style>
    body {
        font-family: Arial, Helvetica, sans-serif;
        background-color: rgb(241, 199, 146);
        padding: 20px;

        text-align: center;
    }
    *{
        justify-content: center;
    }

    h2 {
        color: navy;
    }

    .bag-color {
        background-color: aqua;
        height: 300px;
        width: 300px;
    }

    .bag-img {

        background-image: url(https://frontlinesmedia.in/wp-content/uploads/2026/04/Navayuva-Bharat-Flm-poster.png);
        background-size: cover;
        color: wheat;
        height: 300px;
        width: 500px;
    }

    .bag-repeat {

        background-image: url(https://frontlinesmedia.in/wp-content/uploads/2026/04/Navayuva-Bharat-Flm-poster.png);
        background-repeat: repeat;
        background-color: antiquewhite;
        color: wheat;
        height: 300px;
        width: 500px;
    }

    .bag-position {
        background-image: url(https://frontlinesmedia.in/wp-content/uploads/2026/04/Navayuva-Bharat-Flm-poster.png);
        background-repeat: no-repeat;
        background-position: right bottom;
        background-size: 150px;
        background-color: #333;
        color: white;
         height: 300px;
        width: 500px;
    }

    .bag-size {

        background-image: url(https://frontlinesmedia.in/wp-content/uploads/2026/04/Navayuva-Bharat-Flm-poster.png);
        background-repeat: no-repeat;
        background-size: contain;
        background-position: center;
        background-color: #444;
        color: white;
        height: 300px;
        width: 500px;
    }
</style>

<body>
    <h1>Baground Properties </h1>

    <div class="bag-color">
        <h2>bag-color</h2>
    </div>

    <div class="bag-img">
        <h2>bag-img</h2>
    </div>

    <div class="bag-repeat">
        <h2>bag-repeat</h2>
    </div>

    <div class="bag-position">
        <h2>bag-position</h2>
    </div>

    <div class="bag-size">
        <h2>bag-size</h2>
    </div>

</body>

</html>
