<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<style>
    body{
        font-family: Arial, Helvetica, sans-serif;
        background-color: antiquewhite;
        padding: 20px;
    }

    h1{
        text-align: center;
        color: navy;
    }

    .soild{
        border: 4px solid blue;
    }

    .dashed{

        border: 5px dashed red;
    }
    .dotted{

        border: 3px dotted green;
    }
    .groove{

        border: 5px groove orange;
    }
    .insert{

        border: 5px inset brown;
    }
    .outset{
        border: 5px outset purple;
    }

</style>
<body>
    <h1>css border styles </h1>

    <div class="soild">solid bordes</div>
    <div class="dashed">dashed border</div>
    <div class="dotted">dotted border</div>
    <div class="groove">groove border</div>
    <div class="inser">insert border</div>
    <div class="outset">outset border</div>
   
</body>
</html>
