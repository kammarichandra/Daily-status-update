<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    body {
        font-family: Arial, Helvetica, sans-serif;
        background-color: aquamarine;
        padding: 20px;
        text-align: center;
        justify-content: center;
    }

    h1 {
        color: navy;
    }

    .r1 {
        border-radius: 5px;
        border: 2px solid navy;
        padding: 15px;
        margin: 10px auto;
        width: 200px;
    }

    .r2 {
        border-radius: 15px;
        border: 2px solid navy;
        padding: 15px;
        margin: 10px auto;
        width: 200px;
    }

    .r3 {
        border-radius: 25px;
        border: 2px solid navy;
        padding: 15px;
        margin: 10px auto;
        width: 200px;
    }

    .r4 {
        border-radius: 15px;
        border: 2px solid navy;
        padding: 15px;
        margin: 10px auto;
        width: 200px;
    }

    .circle {
        width: 120px;
        height: 120px;
        border-radius: 50%;
        background-color: blueviolet;
    }

    .oval {
        width: 250px;
        height: 120px;
        border-radius: 50px;
        background-color: burlywood;
    }

    .top {

        border-radius: 0 0 20px 50px;
        background-color: burlywood;
    }

    .bottom {
        border-radius: 0 0 20px 20px;
        background-color: violet;
    }
</style>

<body>
    <h1>Border Radius </h1>

    <div class="r1">1</div>
    <div class="r2">2</div>
    <div class="r3">3</div>
    <div class="r4">4</div>

    <div class="circle">circle</div>
    <div class="oval">oval shape</div>
    <div class="top">top rounded</div>
    <div class="bottom">bottom rounded</div>
</body>

</html>
