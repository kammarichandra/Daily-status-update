<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Css Box Model</title>
</head>

<style>
    .box{
        width: 200px;
        color: black;
        padding: 20px;
        border: 5px solid navy;
        margin: 30px;
        justify-content: center;
        background-color: aqua;
    }
    h2{
        text-align: center;
        padding: 10px;
        background-color: blueviolet;
    }
    .box1{
        background-color: lightblue;
        border: 2px solid black;
        width: 50%;
        text-align: center;
        padding: 20px;
    }
    .box2{
        background-color: bisque;
        border: 2px solid black;
        margin: 20px;
        text-align: center;
    }
</style>
<body>
    
    <div class="box">

        <h2>this is css box</h2>
    </div>

    <div class="box1">

        padding exmple
    </div>

    <div class="box2">
        Margin example
    </div>
    
</body>
</html>
