<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    .block{
        display: block;
        background-color: lightblue;
        padding: 10px;
        margin: 10px;
    }
    
    .inline{
        display: inline;
        background: lightgreen;
        padding: 5px;
    }

    .block{
        display: inline-block;
        width: 100px;
        height: 50px;
        background: lightcoral;
        text-align: center;
        line-height : 50px;
        margin: 5px;
    }

    .hidden{
        display: none;
    }

</style>
<body>
    <h3>block</h3>

    <div class="block">Block 1</div>
    <div class="block">Block 2</div>

    <h3>Inline</h3>

    <span class="inline">Html</span>
    <span class="inline">Css</span>
    <span class="inline">Js</span>

    <h4>Inline block</h4>

    <div class="block">box 1</div>
    <div class="block">box 2</div>
    <div class="block">box 3</div>

    <h3>None</h3>
    <p class="hidden">Lorem ipsum dolor sit.</p>

    <p>Lorem ipsum dolor sit amet.</p>
</body>
</html>
