<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    .container{
        display: flex;
        justify-content: space-around;
        align-items: center;
        background: steelblue;
        padding: 15px;
    }

    .gallery{
        display: grid;
        grid-template-columns: repeat(3,1fr);
        gap: 15px;
    }
    .gallery div{
        background: lightblue;
        padding: 15px;
        text-align: center;
    }
</style>
<body>

    <div class="container">

        <div>Home</div>
        <div>About</div>
        <div>Service</div>
        <div>Contact</div>
    </div><br><br>

    <div class="gallery">
        <div>1</div>
        <div>2</div>
        <div>3</div>
        <div>4</div>
        <div>5</div>
        <div>6</div>
    </div>
</body>
</html>
