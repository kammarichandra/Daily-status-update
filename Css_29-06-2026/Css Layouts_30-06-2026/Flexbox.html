<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    .container {
        display: flex;
        flex-direction: row;
        flex-flow: row wrap;
        justify-content: center;
        align-items: center;
        gap: 20px;

    }

    .container1 {
        display: flex;
        flex-wrap: wrap;
        gap: 20px;
    }

    .card {
        flex: 1 1 250px;
        padding: 20px;
        background: aqua;
        border-radius: 8px;
    }

    .item {
        flex: 1 1 100px;
        padding: 30px;
        background: #ff6b6b;
        border-radius: 8px;
        color: white;
        font-weight: bold;
        text-align: center;
    }

    .navbar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 15px;
        background: #333;
        text-align: center;
        color: white;
    }

    .menu {
        display: flex;
        gap: 20px;
    }

    .menu a {
        color: white;
        text-decoration: none;
        padding: 8px 15px;
        transition: 0.3s;
    }

    .menu a:hover {
        background: #555;
        border-radius: 4px;
    }

    @media (max-width: 600px) {
        .navbar {
            flex-direction: column;
        }

        .menu {
            flex-direction: column;
            margin-top: 10px;
        }
    }
    
</style>

<body>
    <nav class="navbar">
        <div>logo</div>
        <div class="menu">
            <a href="">Home</a>
            <a href="">About</a>
            <a href="">Contact</a>
        </div>
    </nav>

    <div class="container">

        <div class="item">1</div>
        <div class="item">2</div>
        <div class="item">3</div>

    </div>

    <div class="container1">

        <div class="card">card 1</div>
        <div class="card">card 2</div>
        <div class="card">card 3</div>

    </div>

</body>

</html>
