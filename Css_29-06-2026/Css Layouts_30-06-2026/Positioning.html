<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
<style>

    body{
        font-family: Arial, Helvetica, sans-serif;
        margin: 20px;
    }
    div{
        width: 180px;
        padding: 20px;
        margin: 20px;
        border: 2px solid black;
    }
    .static{
        background: lightblue;
    }
    .relative{
        position: relative;
        left: 40px;
        top: 15px;
        background: green;
    }
    .container{
        position: relative;
        width: 250px;
        height: 200px;
        border: 2px solid grey;
    }
    .absolute{
        position: absolute;
        top: 30px;
        left: 80px;
        background: orange;
    }
    .sticky{
        position: sticky;
        top: 0;
        background: purple;
        color: white;
        padding: 15px;
    }
    .content{
        height: 100px;
    }
</style>
</head>
<body>
    <div class="sticky">Sticky</div>
    <div class="static">static</div>
    <div class="relative">relative</div>

    <div class="container">
        <div class="absolute">
            Absolute
        </div>
    </div>

    <div class="content">

        scroll this

    </div>
</body>
</html>
