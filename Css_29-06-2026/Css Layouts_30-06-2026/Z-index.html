<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    .cotainer {
        position: relative;
        width: 400px;
        height: 300px;
        margin: 50px;
    }

    div {
        width: 150px;
        height: 150px;
        color: white;
        font-size: 20px;
        font-weight: bold;
        display: flex;
        justify-content: center;
        align-items: center;
        position: absolute;
    }
    .box1{
        background: crimson;
        top: 20px;
        left: 20px;
        z-index: 1;
    }
     .box2{
        background: blue;
        top: 50px;
        left: 80px;
        z-index: 3;
    }

     .box3{
        background: purple;
        top: 80px;
        left: 100px;
        z-index: 3;
    }
</style>

<body>
    <div class="container">
        <div class="box1">1</div>
        <div class="box2">2</div>
        <div class="box3">3</div>
    </div>
</body>

</html>
