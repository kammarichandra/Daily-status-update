<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<style>
    * {
        margin: 0px;
        padding: 0px;
        box-sizing: border-box;
    }

    body {
        font-family: Arial, Helvetica, sans-serif;
        background: lightcyan;
    }

    .container {
        display: grid;

        grid-template-columns: 250px 1fr;

        grid-template-areas:
            "header header"
            "nav nav"
            "sidebar content"
            "footer footer";

        gap: 20px;
        padding: 20px;
    }

    header {
        background: #3498db;
        color: white;
        padding: 20px;

        display: flex;
        justify-content: center;
        align-items: center;

    }

    .navbar {
        grid-area: nav;
        background: #222;

        display: flex;
        justify-content: center;
        gap: 30px;
        padding: 15px;
    }

    .navbar a {
        color: white;
        text-decoration: none;
    }

    .sidebar {
        grid-area: sidebar;
        background: #e67e22;
        color: white;
        padding: 20px;
    }

    .content {
        grid-area: content;

        display: flex;
        flex-wrap: wrap;
        gap: 20px;
    }

    .card {
        flex: 1 1 250px;

        background: white;
        padding: 20px;

        border-radius: 8px;

        box-shadow: 0 0 10px rgba(0, 0, 0, .2);

        text-align: center;
    }

    /* ===== Footer ===== */

    .footer {
        grid-area: footer;

        background: #2ecc71;
        color: white;
        padding: 20px;

        display: flex;
        justify-content: center;
        align-items: center;
    }

    /* ===== RESPONSIVE DESIGN ===== */

    @media(max-width:768px) {

        .container {

            grid-template-columns: 1fr;

            grid-template-areas:

                "header"
                "nav"
                "content"
                "sidebar"
                "footer";

        }

        .navbar {

            flex-direction: column;
            align-items: center;

        }

        .content {

            flex-direction: column;

        }

    }
</style>

<body>
    <div class="container">

        <header class="header">
            <h1>My Responsive Website</h1>
        </header>

        <nav class="navbar">
            <a href="">Home</a>
            <a href="">About</a>
            <a href="">Services</a>
            <a href="">Contact</a>
        </nav>

        <aside class="sidebar">
            <h2>Sidebar</h2>
            <p>Links and additional content.</p>
        </aside>

        <main class="content">

            <div class="card">
                <h3>Card 1</h3>
                <p>Responsive using Flexbox.</p>
            </div>

            <div class="card">
                <h3>Card 2</h3>
                <p>Responsive using Flexbox.</p>
            </div>

            <div class="card">
                <h3>Card 3</h3>
                <p>Responsive using Flexbox.</p>
            </div>

        </main>

        <footer class="footer">
            <p>© 2026 My Website</p>
        </footer>

    </div>
</body>

</html>
