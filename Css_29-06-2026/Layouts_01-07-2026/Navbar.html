<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Navbar</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: rgb(4, 44, 54);
            padding: 40px;
        }

        .nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: lightcoral;
            padding: 20px;
        }

        .logo {
            color: white;
            font-size: 24px;
            font-weight: bold;
        }

        .links {
            display: flex;
            list-style: none;
            gap: 20px;
            justify-content: center;
            padding-left: 0;
        }

        .links li {
            list-style: none;
        }

        .links a {
            color: white;
            text-decoration: none;
            font-size: 18px;
            display: inline-block;
            padding: 6px 8px;
        }

        .links a:hover {
            color: cadetblue;
        }

        @media (max-width: 768px) {
            .nav {
                flex-direction: column;
                align-items: flex-start;
                gap: 12px;
            }

            .links {
                flex-direction: column;
                width: 100%;
                gap: 6px;
            }

            .links a {
                display: block;
                width: 100%;
                padding: 10px 12px;
            }
        }

        .container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
        }

        .card {
            background: white;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
            flex: 1 1 300px;
            max-width: 350px;
        }

        .card img {
            width: 100%;
            height: 500px;
            display: block;
        }

        .card h2 {
            padding: 15px;
        }

        .card p {
            padding: 20px;
        }

        .card button {
            margin: 15px;
            padding: 10px 20px;
            background: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        .card button:hover {
            background: #0056b3;
        }
    </style>
</head>

<body>
    <header>
        <nav class="nav">
            <div class="logo">Logo</div>

            <ul class="links">
                <li><a href="#">Home</a></li>
                <li><a href="#">About</a></li>
                <li><a href="#">Service</a></li>
                <li><a href="#">Contact</a></li>
            </ul>
        </nav><br><br>

        <div class="container">

            <div class="card">
                <img src="./Chicken-Biryani-Recipe-01-1.jpg" alt="">
                <h2>card 1</h2>
                <p>Lorem ipsum dolor sit.</p>
                <button>read more </button>
            </div>

            <div class="card">
                <img src="./Chicken-Biryani-Recipe-01-1.jpg" alt="">
                <h2>card 2</h2>
                <p>Lorem ipsum dolor sit.</p>
                <button>read more </button>
            </div>

            <div class="card">
                <img src="./Chicken-Biryani-Recipe-01-1.jpg" alt="">
                <h2>card 3</h2>
                <p>Lorem ipsum dolor sit.</p>
                <button>read more </button>
            </div>

        </div>
    </header>
</body>

</html>
