<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    body {
        margin: 0px;
        font-family: Arial, Helvetica, sans-serif;
    }

    .navbar {
        display: flex;
        flex-direction: column;
        align-items: center;
        background: lightcoral;
        padding: 15px;
        color: white;
    }

    .links {
        display: flex;
        flex-direction: row;
        gap: 10px;
        margin-top: 10px;
    }

    .links a {
        color: white;
        text-decoration: none;
    }

    .header {
        text-align: center;
        padding: 20px;
        background: lightblue;
    }

    .container {
        display: grid;
        grid-template-columns: 1fr;
        gap: 15px;
        padding: 15px;
    }

    .card {
        background: white;
        padding: 30px;
        text-align: center;
        border: 2px solid black;
    }

    footer {
        text-align: center;
        padding: 15px;
        background: #333;
        color: white;
    }

    /* tablet */
    @media (min-width: 768px) {

        .navbar {
            flex-direction: row;
            justify-content: space-between;
            padding: 20px;
        }

        .links {
            flex-direction: row;
            gap: 20px;
            margin-top: 0;
        }

        .container {
            grid-template-columns: repeat(2, 1fr);
        }

        .header {
            padding: 50px;
        }
    }

    /* laptop  */
    @media(min-width: 1024px) {
        .container {
            grid-template-columns: repeat(3, 1fr);

        }

        .header h1 {
            font-size: 40px;
        }

        .header {
            padding: 40px;
        }
    }

    /* desktop */

    @media (min-width: 1440px) {

        .container {
            grid-template-columns: repeat(4, 1fr);

        }

        .header h1 {
            font-size: 50px;
        }

        .header {
            padding: 100px;
        }
    }
</style>

<body>
    <nav class="navbar">
        <!-- <h2>Web page</h2> -->
        <div class="links">
            <a href="">Home</a>
            <a href="">Service</a>
            <a href="">About</a>
            <a href="">Contact</a>
        </div>
    </nav>
    
    <!-- header section  -->

    <header class="header">
        <h1>Buid responsive </h1>
        <p>Lorem ipsum dolor sit.</p>
    </header>

    <!-- main content  -->

    <section class="container">

        <div class="card">card 1</div>
        <div class="card">card 2</div>
        <div class="card">card 3</div>
        <div class="card">card 4</div>
        <div class="card">card 5</div>
        <div class="card">card 6</div>

    </section>

    <footer>
        <p>Lorem ipsum dolor sit.</p>
    </footer>

</body>

</html>
