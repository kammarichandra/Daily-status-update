<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>FoodExpress</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #f8f9fa;
            color: #333
        }

        header {
            background: #ff5722;
            color: #fff;
            padding: 18px;
            text-align: center
        }

        nav {
            display: flex;
            justify-content: center;
            gap: 12px;
            background: #333;
            padding: 8px;
            flex-wrap: wrap
        }

        nav a {
            color: #fff;
            text-decoration: none;
            padding: 8px 12px
        }

        .hero {
            background: url("https://images.unsplash.com/photo-1504674900247-0877df9cc836?auto=format&fit=crop&w=1400&q=80") center/cover no-repeat;
            height: 220px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-size: 24px
        }

        .container {
            max-width: 1100px;
            margin: 20px auto;
            padding: 0 16px
        }

        .cards {
            display: flex;
            flex-wrap: wrap;
            gap: 16px
        }

        .card {
            background: #fff;
            border-radius: 8px;
            flex: 1 1 240px;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0, 0, 0, .12)
        }

        .card img {
            width: 100%;
            height: 150px;
            object-fit: cover;
            display: block
        }

        .card .body {
            padding: 12px
        }

        .card h3 {
            margin-bottom: 6px;
            font-size: 18px
        }

        .card p {
            color: #666;
            margin-bottom: 12px
        }

        .btn {
            display: inline-block;
            padding: 8px 12px;
            background: #ff5722;
            color: #fff;
            border-radius: 6px;
            text-decoration: none
        }

        footer {
            text-align: center;
            padding: 18px;
            background: #333;
            color: #fff;
            margin-top: 22px
        }

        @media(max-width:600px) {
            .hero {
                height: 160px;
                font-size: 18px
            }

            .cards {
                flex-direction: column
            }
        }
    </style>
</head>

<body>
    <header>
        <h1>FoodExpress</h1>
        <div>Fast · Fresh · Delicious</div>
    </header>

    <nav>
        <a href="#">Home</a>
        <a href="#">Menu</a>
        <a href="#">Offers</a>
        <a href="#">Contact</a>
    </nav>

    <section class="hero">Order your favorite food — delivered fast</section>

    <main class="container">
        <h2 style="text-align:center;margin:14px 0">Popular Now</h2>
        <div class="cards">
            <article class="card">
                <img src="https://images.unsplash.com/photo-1513104890138-7c749659a591?auto=format&fit=crop&w=800&q=80"
                    alt="Pizza">
                <div class="body">
                    <h3>Pizza</h3>
                    <p>$12.99</p>
                    <a class="btn" href="#">Order</a>
                </div>
            </article>

            <article class="card">
                <img src="https://images.unsplash.com/photo-1550547660-d9450f859349?auto=format&fit=crop&w=800&q=80"
                    alt="Burger">
                <div class="body">
                    <h3>Burger</h3>
                    <p>$9.99</p>
                    <a class="btn" href="#">Order</a>
                </div>
            </article>

            <article class="card">
                <img src="https://images.unsplash.com/photo-1604908176997-4317c288032e?auto=format&fit=crop&w=800&q=80"
                    alt="Biryani">
                <div class="body">
                    <h3>Biryani</h3>
                    <p>$14.99</p>
                    <a class="btn" href="#">Order</a>
                </div>
            </article>
        </div>
    </main>

    <footer>
        © 2026 FoodExpress — Fast Delivery
    </footer>
</body>

</html>
