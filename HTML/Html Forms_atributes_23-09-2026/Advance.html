<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>

    <form action="">
        <label for="nmae">Name : </label>
        <input type="text" id="name" placeholder="enter your name " required><br><br>

        <label for="email">Email : </label>
        <input type="email" id="email" placeholder="enter your mail" required><br><br>

        <label for="email">Age : </label>
        <input type="number" id="age" placeholder="enter your age" required><br><br>

        <label for="mobile number">Mobile Number : </label>
        <input type="number" id="Mobile Number" placeholder="enter your mobile number " required><br><br>

        <button type="submit">Submit</button>
    </form>

    <!-- fieldset -->

    <fieldset>
        <legend>
            <h1>form</h1>
        </legend>
        <label for="">Name : </label>
        <input type="text"><br><br>
        <label for="">Name : </label>
        <input type="text"><br><br>
        <label for="">Name : </label>
        <input type="text"><br><br>
        <label for="">Name : </label>
        <input type="text"><br><br>
    </fieldset>


    <fieldset>
        <legend>Education</legend>

        <label for="">Degree :</label>

        <select name="degree" id="degree">
            <option value="">Select Degree </option>
            <option value="">B.tech</option>
            <option value="">Agri</option>
            <option value="">Bcom</option>
        </select>
    </fieldset>

    <label for="department">Department:</label>

    <select id="department" name="department">

        <option value="">-- Select Department --</option>

        <option value="java">
            Java Development
        </option>

        <option value="frontend">
            Frontend Development
        </option>

        <option value="testing">
            Testing
        </option>

        <option value="hr">
            HR
        </option>

    </select><br><br>


    <label>Gender:</label>

    <br><br>

    <input type="radio" id="male" name="gender" value="male">

    <label for="male">Male</label><br><br>

    <input type="radio" id="female" name="gender" value="female">

    <label for="female">Female</label><br><br>

    <input type="radio" id="other" name="gender" value="other">

    <label for="other">Other</label><br><br>

    <!-- iframes -->

    <iframe src="https://www.example.com" width="600" height="400" title="Example Website">
    </iframe><br><br>

    <iframe width="560" height="315" src="https://www.youtube.com/embed/dQw4w9WgXcQ" title="YouTube Video"
        allowfullscreen>
    </iframe><br><br>

    <!-- Figcaption
    <figcaption> provides a caption for the figure. -->

    <figure>

        <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQnEg9vUT86btTAgtYu2SJ0BhfgrfSU6rIQvZ4r-web7XdUIrC6fnn7mRA&s=10"
            alt="Employee working at a computer" width="400">

        <figcaption>
            Employee working on a project.
        </figcaption>

    </figure>

    <!-- Details and Summary
<details> creates expandable content.

<summary> provides the clickable title. -->

    <details>

        <summary>
            What is HTML?
        </summary>

        <p>
            HTML stands for HyperText Markup Language.
            It is used to structure web pages.
        </p>

    </details>

    
</body>

</html>
