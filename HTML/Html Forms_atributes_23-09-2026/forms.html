<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <form action="">
        <label for="">Name : </label>
        <input type="text" placeholder="enter your name" required><br><br>
        <label for="">Mobile Number : </label>
        <input type="number" placeholder="enter your phome number"><br><br>
        <label for="">Date of Birth : </label>
        <input type="date" placeholder="enter your date of birth"><br><br>
        <label for="">Gender : </label><br><br>
        <input type="radio" name="Gender" value="male">
        <label for="">Male</label><br><br>
        <input type="radio" name="Gender" value="female">
        <label for="">Female</label><br><br>
        <input type="radio" name="Gender" value="Other">
        <label for="">Other</label><br><br>

        <label for="">Email : </label>
        <input type="email" placeholder="enter your mail" required><br><br>
        <label for="">Password : </label>
        <input type="password" placeholder="enter password" required><br><br>
        <label for="">Upload Cv : </label>
        <input type="file" placeholder="upload your cv"><br><br>
        <button>Submit</button>
    </form><br><br><hr>

    
    <label>Skills:</label><br><br>

    <input type="checkbox" name="skill" value="java">
    <label>Java</label><br><br>

    <input type="checkbox" name="skill" value="html">
    <label>HTML</label><br><br>

    <input type="checkbox" name="skill" value="css">
    <label>CSS</label><br><br>
<hr>

<label>Choose Department:</label>

<select>
    <option value="">-- Select Department --</option>
    <option value="hr">HR</option>
    <option value="development">Development</option>
    <option value="testing">Testing</option>
    <option value="design">Design</option>
</select>


</body>

</html>
