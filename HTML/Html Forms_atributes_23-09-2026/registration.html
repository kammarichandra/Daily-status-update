<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <h1>Registration Form</h1>
    
    <form action="">
        
        <label for="">Full Name : </label>
        <input type="text" placeholder="enter your fullname" required><br><br>
        <label for="">Email : </label>
        <input type="email" placeholder="enter your email" required><br><br>
        <label for="">Password : </label>
        <input type="password" placeholder="enter password" required><br><br>
        <label for="">Age : </label>
        <input type="number" placeholder="enter your age" required><br><br>
        <label for="">Date of Birth : </label>
        <input type="date" required><br><br>
        <label for="">Upload Resume : </label>
        <input type="file" required><br><br>

        <label for="">Gender : </label><br><br>

        <input type="radio" value="male" name="Gender">
        <label for=""> Male</label><br><br>

        <input type="radio" value="female" name="Gender">
        <label for="">Female</label><br><br>

        <input type="radio" value="other" name="Gender">
        <label for="">Other</label><br><br>

        <label>Skills:</label><br><br>

        <input type="checkbox" name="skill" value="java">
        <label>Java</label><br><br>

        <input type="checkbox" name="skill" value="html">
        <label>HTML</label><br><br>

        <input type="checkbox" name="skill" value="css">
        <label>CSS</label><br><br>

        <label>Choose Department:</label>

        <select>
            <option value="">-- Select Department --</option>
            <option value="hr">HR</option>
            <option value="development">Development</option>
            <option value="testing">Testing</option>
            <option value="design">Design</option>
        </select><br><br>

        <label for="">Address : </label><br><br>
        <textarea rows="5" cols="30" placeholder="Enter your address"></textarea><br><br>

        <button>Register</button>
        <button>Reset</button>
        <button>click me</button>

    </form>
</body>

</html>
