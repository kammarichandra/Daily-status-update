<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web Storage Practice</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h2>Local Storage</h2>

    <input type="text" id="username" placeholder="Enter Username">

    <button id="saveBtn">Save Username</button>
    <button id="getBtn">Get Username</button>
    <button id="updateBtn">Update Username</button>
    <button id="removeBtn">Remove Username</button>
    <button id="clearBtn">Clear Local Storage</button>

    <p id="usernameOutput"></p>

    <hr>

    <h2>Dark Mode</h2>

    <button id="themeBtn">Toggle Dark Mode</button>

    <hr>

    <h2>Employee JSON Operations</h2>

    <input type="text" id="employeeName" placeholder="Employee Name">
    <input type="number" id="employeeSalary" placeholder="Salary">

    <button id="addEmployeeBtn">Add Employee</button>

    <div id="employeeOutput"></div>

    <hr>

    <h2>Session Storage</h2>

    <input type="text" id="loginName" placeholder="Enter Login Name">

    <button id="loginBtn">Login</button>
    <button id="getSessionBtn">Get Session</button>
    <button id="logoutBtn">Logout</button>

    <p id="sessionOutput"></p>

    <hr>

    <h2>Temporary Form Draft</h2>

    <textarea id="draft" placeholder="Write your temporary draft..."></textarea>

    <p id="draftMessage"></p>

    <script src="./BrowserStorage.js"></script>
</body>
</html>
