<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Browser APIs</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h2>Browser APIs Practice</h2>

    <!-- Window API -->
    <button id="windowBtn">Window Information</button>
    <p id="windowOutput"></p>

    <!-- Document API -->
    <button id="documentBtn">Change Heading</button>
    <h3 id="heading">Welcome to JavaScript</h3>

    <!-- Location API -->
    <button id="locationBtn">Get Current URL</button>
    <p id="locationOutput"></p>

    <!-- History API -->
    <button id="backBtn">Go Back</button>
    <button id="forwardBtn">Go Forward</button>

    <!-- Timers -->
    <h3>setTimeout()</h3>
    <button id="timeoutBtn">Show Message After 3 Seconds</button>
    <p id="timeoutOutput"></p>

    <h3>setInterval()</h3>
    <p id="timer">0</p>

    <button id="startBtn">Start Timer</button>
    <button id="stopBtn">Stop Timer</button>
    <button id="resetBtn">Reset Timer</button>

    <script src="./BrowserApi.js"></script>
</body>
</html>
