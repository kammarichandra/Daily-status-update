<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DOM Attributes, Classes & Styles</title>

</head>
<body>

    <h1 id="heading">Employee Profile</h1>

    <!-- Employee Profile -->
    <div class="employee-card" id="employeeCard">

        <img id="employeeImage" src="https://placehold.co/150"  alt="Employee Profile" width="150" >

        <h2 id="employeeName">Chandra</h2>

        <p id="employeeRole">Frontend Developer</p>

        <button id="changeImageBtn">Change Image</button>

        <button id="changeRoleBtn">Change Role</button>

        <button id="styleBtn">Change Style</button>

    </div>

    <hr>

    <!-- Dark Mode -->
    <button id="darkModeBtn">Toggle Dark Mode</button>

    <hr>

    <!-- Show / Hide -->
    <button id="toggleBtn">Hide Employee Details</button>

    <div id="employeeDetails">
        <p>Employee ID: EMP101</p>
        <p>Department: Software Development</p>
        <p>Experience: Fresher</p>
    </div>

    <script src="./DomCss.js"></script>

</body>
</html>
