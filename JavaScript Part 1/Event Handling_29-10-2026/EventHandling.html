<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>JavaScript Click Events</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1>JavaScript Click Events</h1>

    <!-- Welcome Message -->
    <section>
        <h2>1. Welcome Message</h2>

        <button id="welcomeBtn">Click Me</button>

        <p id="welcomeMessage"></p>
    </section>

    <hr>

    <!-- Background Color -->
    <section>
        <h2>2. Change Background Color</h2>

        <button id="colorBtn">Change Color</button>
    </section>

    <hr>

    <!-- Counter -->
    <section>
        <h2>3. Counter Application</h2>

        <button id="decreaseBtn">-</button>

        <span id="counter">0</span>

        <button id="increaseBtn">+</button>

        <button id="resetBtn">Reset</button>
    </section>

    <hr>

    <!-- Like and Dislike -->
    <section>
        <h2>4. Like and Dislike</h2>

        <button id="likeBtn">👍 Like</button>

        <span id="likeCount">0</span>

        <button id="dislikeBtn">👎 Dislike</button>

        <span id="dislikeCount">0</span>
    </section>

    <hr>

    <!-- Password Visibility -->
    <section>
        <h2>5. Password Visibility</h2>

        <input
            type="password"
            id="password"
            placeholder="Enter password"
        >

        <button id="togglePasswordBtn">
            Show Password
        </button>
    </section>

    <hr>

    <!-- Theme Toggle -->
    <section>
        <h2>6. Light Mode and Dark Mode</h2>

        <button id="themeBtn">Dark Mode</button>
    </section>

    <script src="script.js"></script>

</body>
</html>
