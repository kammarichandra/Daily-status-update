<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    
    <h1>JavaScript Input and Change Events</h1>

    <!-- 1. Real-Time Input -->
    <section>
        
        <h2>1. Real-Time Input</h2>

        <input type="text" id="textInput" placeholder="Enter your name" >

        <p id="liveOutput">Your text will appear here.</p>

    </section>

    <hr>

    <!-- 2. Character Counter -->
    <section>
        <h2>2. Live Character Counter</h2>

        <textarea
            id="messageInput"
            maxlength="100"
            placeholder="Write a message..."
        ></textarea>

        <p>
            Characters:
            <span id="charCount">0</span>/100
        </p>
    </section>

    <hr>

    <!-- 3. Dropdown -->
    <section>
        <h2>3. Select Department</h2>

        <select id="departmentSelect">
            <option value="">Select Department</option>
            <option value="Frontend">Frontend Development</option>
            <option value="Backend">Backend Development</option>
            <option value="Testing">Software Testing</option>
            <option value="HR">Human Resources</option>
        </select>

        <p id="selectedDepartment">
            No department selected.
        </p>
    </section>

    <hr>

    <!-- 4. Dynamic Heading -->
    <section>
        <h2 id="dynamicHeading">Welcome to Employee Portal</h2>

        <input type="text" id="headingInput" placeholder="Enter heading text" >
    </section>

    <hr>

    <!-- 5. Employee Search -->
    <section>

        <h2>5. Employee Search</h2>

        <input type="text" id="searchInput" placeholder="Search employees..." >

        <div id="employeeList"></div>

        <p id="noResults" hidden>
            No employees found.
        </p>

    </section>

    <script src="./Input_chnageEvent.js"></script>
</body>
</html>
