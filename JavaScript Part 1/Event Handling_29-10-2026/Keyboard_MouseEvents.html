<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Keyboard and Mouse Events</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>Keyboard and Mouse Events</h1>

    <!-- Keyboard Events -->
    <section>

        <h2>1. Keyboard Events</h2>

        <input type="text" id="keyboardInput" placeholder="Press any key" >

        <p id="keyMessage">Key message will appear here.</p>

    </section>

    <hr>

    <!-- Mouse Coordinates -->
    <section>
        <h2>2. Mouse Coordinates</h2>

        <div id="mouseArea"> Move your mouse here </div>

        <p id="mouseCoordinates">
            X: 0 | Y: 0
        </p>
    </section>

    <hr>

    <!-- Mouse Enter and Leave -->
    <section>
        <h2>3. Mouse Enter and Leave</h2>

        <div id="colorBox">
            Move your mouse over this box
        </div>
    </section>

    <hr>

    <!-- Keyboard Controlled Movement -->
    <section>
        <h2>4. Keyboard-Controlled Character</h2>

        <p>Use Arrow Keys to move the character.</p>

        <div id="gameArea">
            <div id="character">😊</div>
        </div>

        <p id="movementMessage">
            Use Arrow keys to move.
        </p>
    </section>

    <script src="./Keyboard_MouseEvents.js"></script>

</body>
</html>
