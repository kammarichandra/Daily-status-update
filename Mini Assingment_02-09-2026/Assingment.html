<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    body {
        font-family: Arial, sans-serif;
        background: #f4f6f8;
        margin: 0;
        padding: 30px;
    }

    .container {
        max-width: 700px;
        margin: auto;
        background: white;
        padding: 25px;
        border-radius: 12px;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
    }

    h1 {
        text-align: center;
        color: #333;
    }

    .form {
        display: flex;
        gap: 10px;
        margin-bottom: 20px;
    }

    input {
        flex: 1;
        padding: 10px;
        border: 1px solid #ccc;
        border-radius: 5px;
    }

    button {
        padding: 10px 15px;
        border: none;
        border-radius: 5px;
        background: #007bff;
        color: white;
        cursor: pointer;
    }

    button:hover {
        background: #0056b3;
    }

    .task {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 12px;
        margin: 8px 0;
        background: #f1f1f1;
        border-radius: 6px;
    }

    .completed {
        text-decoration: line-through;
        color: gray;
    }

    #status {
        color: #555;
        margin-bottom: 15px;
    }
</style>

<body>
    <div class="container">

        <h1>Smart Task Manager</h1>

        <div class="form"> 
            <input type="text" id="taskInput" placeholder="Enter a task"> 
            <button id="addTaskBtn">Add Task</button> 
        </div>
        
        <p id="status">

        </p>
        <div id="taskList"></div>
    </div>
    <script src="./Assingment.js"></script>
</body>

</html>
